set timeout=0
set default=0
insmod all_video
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus
set gfxmode=1024x768x32,1024x768,800x600,640x480
menuentry "FOS" {
    multiboot2 /boot/fos.elf
    boot
}
menuentry "FOS videoinfo" {
    videoinfo
    sleep 15
    multiboot2 /boot/fos.elf
    boot
}